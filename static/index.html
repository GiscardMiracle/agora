<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agora</title>
  <script>
    (() => {
      let t = null;
      try { t = localStorage.getItem("agora-theme"); } catch {}
      if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2' y='2' width='9' height='9' rx='2' fill='%2314171c'/><rect x='13' y='2' width='9' height='9' rx='2' fill='%2314171c'/><rect x='2' y='13' width='9' height='9' rx='2' fill='%2314171c'/><rect x='13' y='13' width='9' height='9' rx='2' fill='%232b53e6'/></svg>">
</head>
<body>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <div class="content">
      <header class="top">
        <button class="burger" id="burger" aria-label="menu"></button>
        <nav id="nav"></nav>
      </header>
      <main id="app"></main>
    </div>
  </div>
  <div id="toast"></div>
  <script src="/static/ansi.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
